    abstract: "This work investigates cost-efficient fault-tolerant strategies for mapping multiple soft real-time stream-processing applications with moldable-parallel tasks across the device-edge-cloud continuum.  This work proposes two static fault-tolerant scheduling methods within a single-node failure model. The research examines remapping failed tasks onto active resources and explores backup task placement to enhance system reliability.  Both proposed methods use task parallelization and dynamic voltage and frequency scaling (DVFS) to balance application throughput and energy consumption. These methods aim to minimize overall costs, including device and edge energy consumption and cloud resource rental, while ensuring fault tolerance in the event of a single edge node failure. The evaluation results show that the task remapping mechanism has less than 2% higher cost in both fault-free and single edge node failure scenarios, relative to the optimal solution and the cost increases by less than 1% in the event of a failure compared to the fault-free scenario when scheduled using the same method. The backup placement approach has 2-5% higher cost in the fault-free scenario and 1-3% higher in the failure scenario, relative to optimal solutions in their respective scenarios. For the backup placement approach, the cost reduces by less than 2% in the event of a failure compared to the fault-free scenario, due to the presence of backup tasks."

<style>
:root{
  --bg:#0c121b; --surface:#131b27; --ink:#e8edf3; --muted:#9aa7b8; --line:#243041;
  --accent:#5cc3dd; --accent-soft:#16303a; --chip:#1b2533; --shadow:none;
  --logo-filter:invert(1);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}

/* Header */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{height:44px;width:auto;display:block}
.logo-fallback{font:600 15px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
#uniLogo,#projLogo{display:inline-flex;align-items:center;min-height:44px}
.logo-mono{filter:var(--logo-filter)}
.logo-chip{background:#fff;border-radius:8px;padding:4px 8px;display:inline-flex}

/* Hero */
.hero{padding:48px 0 32px}
.eyebrow{font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{font:600 clamp(28px,5vw,42px)/1.15 var(--serif);margin:0 0 18px;letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:15px;margin:0 0 28px;padding:0;list-style:none}
.meta li{display:flex;align-items:center;gap:6px}
.meta svg{width:16px;height:16px;flex:none}
.person{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--chip)}
.person .n{font:600 18px/1.3 var(--serif)}
.person .r{color:var(--muted);font-size:14px;line-height:1.45}

/* Links */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:500;font-size:15px;transition:border-color .15s,background .15s}
.btn:hover{text-decoration:none;border-color:var(--accent);background:var(--accent-soft)}
.btn svg{width:18px;height:18px;flex:none;color:var(--accent)}
.btn .ext{margin-left:auto;width:14px;height:14px;color:var(--muted)}

/* Sections */
section{padding:28px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}
h2{font:600 24px/1.2 var(--serif);margin:0}
.abstract{padding-top:10px;font-size:16.5px;line-height:1.7;color:var(--ink)}
.abstract p{margin:0 0 14px;text-align:justify;text-justify:inter-word;hyphens:auto}
.abstract p:last-child{margin-bottom:0}
.count{font:400 13px var(--mono);color:var(--muted)}

ol.refs{list-style:none;margin:0;padding:0;counter-reset:r}
ol.refs li{counter-increment:r;display:grid;grid-template-columns:44px 1fr;gap:4px;padding:16px 0;border-bottom:1px solid var(--line)}
ol.refs li::before{content:"[" counter(r) "]";font:400 14px/1.7 var(--mono);color:var(--muted)}
.cite{font-size:15.5px}
.cite .t{font-weight:600}
.cite .v{font-style:italic;color:var(--muted)}

.pubs{list-style:none;margin:0;padding:0}
.pub{padding:20px 0;border-bottom:1px solid var(--line)}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.tag{font:500 12px/1 var(--sans);padding:5px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.y{background:var(--accent-soft);color:var(--accent)}
.pub h3{font:600 18px/1.35 var(--serif);margin:0 0 6px}
.pub h3 a{color:var(--ink)}
.pub h3 a:hover{color:var(--accent)}
.authors{font-size:14.5px;color:var(--muted);margin:0}
.authors b{color:var(--ink);font-weight:600}
.venue{font-size:14.5px;font-style:italic;color:var(--muted);margin:2px 0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.doi{font:400 13px var(--mono);display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--accent);word-break:break-all;min-height:44px}
.doi:hover{text-decoration:none;border-color:var(--accent)}
.doi svg{width:14px;height:14px;flex:none}

footer{border-top:1px solid var(--line);margin-top:24px;padding:28px 0 48px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-direction:column;gap:14px}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.person{margin-top:16px}

@media (max-width:560px){
  .wrap{padding:0 16px}
  .hero{padding:32px 0 20px}
  .logo{height:34px}
  .links{grid-template-columns:1fr 1fr}
  ol.refs li{grid-template-columns:36px 1fr}
}
@media print{
  /* print on white paper, not dark ink-heavy pages */
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#ccc;--accent:#000;--accent-soft:#eee;--chip:#eee;--logo-filter:none;color-scheme:light}
  a{color:#000}
}
</style>
</head>

<main class="wrap">

<script>
(function(){
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const doiUrl = d => "https://doi.org/" + d.replace(/^https?:\/\/(dx\.)?doi\.org\//, "");

  const I = {
    linkedin:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3zM9.5 9.75h3.8v1.6h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.6 4.78 6V21h-4v-5c0-1.2-.02-2.73-1.67-2.73-1.67 0-1.93 1.3-1.93 2.64V21h-4z"/></svg>',
    globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    project:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-7.95A6 6 0 0 1 18 8.5a4.5 4.5 0 0 1-.5 9.5z"/></svg>',
    uni:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg>',
    orcid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 10v7M9 7v.01M12.5 10v7h1.8a3.5 3.5 0 0 0 0-7z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    slides:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></svg>',
    ext:'<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>',
    mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'
  };

  // Logos with graceful text fallback
  function logo(el, src, fallback, mono){
    if(!src){ el.innerHTML = '<span class="logo-fallback">'+esc(fallback)+'</span>'; return; }
    const img = new Image(); img.className = "logo"; img.alt = fallback; img.src = src;
    img.onerror = () => { el.innerHTML = '<span class="logo-fallback">'+esc(fallback)+'</span>'; };
    if(mono){ if(mono!=="color") img.classList.add("logo-mono"); el.appendChild(img); return; }
    const wrap = document.createElement("span"); wrap.className = "logo-chip"; wrap.appendChild(img);
    el.appendChild(wrap);
  }
  logo($("uniLogo"), C.logos.university, "Linköping University", true);
  logo($("projLogo"), C.logos.project, "ASTECC", "color");

  // Talk
  document.title = C.name + " · " + C.talk.title;
  $("talkTitle").textContent = C.talk.title;
  const meta = [[I.mic,C.talk.event],[I.cal,C.talk.date],[I.pin,C.talk.place]].filter(m=>m[1]);
  $("talkMeta").innerHTML = meta.map(m=>'<li>'+m[0]+'<span>'+esc(m[1])+'</span></li>').join("");

  // Abstract
  if(C.talk.abstract && C.talk.abstract.trim()){
    $("absText").innerHTML = C.talk.abstract.trim().split(/\n\s*\n/).map(p=>'<p>'+esc(p.trim())+'</p>').join("");
    $("abstract").hidden = false;
  }

  // Person
  $("pName").textContent = C.name;
  $("pRole").innerHTML = esc(C.role) + "<br>" + esc(C.affiliation);
  if(C.photo){ const a=$("avatar"); a.src=C.photo; a.alt=C.name; a.hidden=false; }

  // Links
  const links = C.links.filter(l=>l.url);
  if(C.talk.slides) links.unshift({label:"Slides (PDF)",url:C.talk.slides,icon:"slides"});
  $("links").innerHTML = links.map(l=>{
    const external = !l.url.startsWith("mailto:");
    return '<a class="btn" href="'+esc(l.url)+'"'+(external?' target="_blank" rel="noopener"':'')+'>'+(I[l.icon]||I.globe)+'<span>'+esc(l.label)+'</span>'+(external?I.ext:'')+'</a>';
  }).join("");

  // References
  const me = C.name;
  const cleanDoi = d => (d||"").replace(/^https?:\/\/(dx\.)?doi\.org\//, "");
  // A full non-doi.org address typed into "doi" is treated as a plain url
  const isWebUrl = s => /^https?:\/\//.test(s||"") && !/^https?:\/\/(dx\.)?doi\.org\//.test(s);
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e){ return "Link"; } };
  $("refList").innerHTML = C.references.map((p,i)=>{
    const authors = esc(p.authors);
    const doi = isWebUrl(p.doi) ? "" : p.doi;
    const web = p.url || (isWebUrl(p.doi) ? p.doi : "");
    const url = doi ? doiUrl(doi) : web;
    const tags = p.year ? '<span class="tag y">'+esc(p.year)+'</span>' : "";
    const title = url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a>' : esc(p.title);
    const linkBtn = (doi ? '<a class="doi" href="'+esc(doiUrl(doi))+'" target="_blank" rel="noopener">doi:'+esc(cleanDoi(doi))+'</a>' : '')
                  + (web ? '<a class="doi" href="'+esc(web)+'" target="_blank" rel="noopener">'+I.link+'<span>'+esc(hostOf(web))+'</span></a>' : '');
    return '<li class="pub">'
      + (tags ? '<div class="tags">'+tags+'</div>' : '')
      + '<h3>'+title+'</h3>'
      + (p.authors ? '<p class="authors">'+authors+'</p>' : '')
      + (p.venue ? '<p class="venue">'+esc(p.venue)+'</p>' : '')
      + (linkBtn ? '<div class="actions">'+linkBtn+'</div>' : '')
      + '</li>';
  }).join("");
  $("refCount").textContent = C.references.length + (C.references.length===1?" item":" items");


  // Footer
  $("ack").textContent = C.acknowledgement;
  $("copyright").textContent = "© " + new Date().getFullYear() + " " + C.name;

})();
</script>
</body>
